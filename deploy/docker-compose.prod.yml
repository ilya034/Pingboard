# deploy/docker-compose.prod.yml — переопределения для «прода» на VPS (фактор X: тот же образ, другой env).
# Запускать из КОРНЯ репозитория (--env-file обязателен: подстановка ${...} читает .env из каталога
# compose-файла, то есть deploy/, а не из корня):
#   docker compose --env-file .env -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml up -d --build
#   docker compose --env-file .env -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml --profile migrate run --rm migrate
#
# Отличия от dev-стенда: Api не публикуется наружу (API_BIND=127.0.0.1:8080 в .env — см. .env.example),
# схему приводит отдельный one-off процесс migrate (фактор XII), а не сам Api.
name: pingboard

services:
  api:
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Схему приводит отдельный процесс migrate, а не сам Api.
      MigrateOnStart: "false"

  worker:
    environment:
      DOTNET_ENVIRONMENT: Production

  postgres:
    volumes:
      - ${PGDATA_PATH:-/srv/pingboard/pgdata}:/var/lib/postgresql

  migrate:
    # Тот же образ и тот же тег, что у api/worker: админ-процесс — это третья команда одного
    # релиза, а не отдельная сборка (факторы V, XII).
    image: pingboard-api:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
      args:
        APP_VERSION: ${APP_VERSION:-0.1.0}
    command: ["dotnet", "Pingboard.Api.dll", "--migrate"]
    env_file: ../.env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    profiles: ["migrate"]
