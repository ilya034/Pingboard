# deploy/nginx.container.conf — конфиг nginx для контейнера, который работает не от root.
# Отличия от deploy/nginx.conf, кроме путей:
#   * listen 8080 и pid/temp в /tmp — требование непривилегированного режима;
#   * location /healthz — собственная проба nginx (в compose её роль играл внешний healthcheck).

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events {
    worker_connections 1024;
}

http {
    # Всё, что nginx пишет на диск, — только временные файлы, и только в /tmp.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;

    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Статика с хешем в имени кэшируется надолго, index.html — нет.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Собственная проба nginx: возвращаем 200 непосредственно, без зависимости от Api.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /readyz {
            proxy_pass http://api:8080/readyz;
            access_log off;
        }

        location /api/ {
            # Имя сервиса api совпадает с compose-именем: и там, и здесь это DNS-имя
            proxy_pass http://api:8080;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        location / {
            try_files $uri /index.html;
        }
    }
}
