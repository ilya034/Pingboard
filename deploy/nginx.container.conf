# deploy/nginx.container.conf — конфиг nginx для контейнера, который работает НЕ от root.
#
# Зачем отдельный файл, а не deploy/nginx.conf: в Docker образ nginx стартует от root,
# поэтому слушает 80-й порт, пишет pid в /var/run и буферы в /var/cache/nginx. В Kubernetes
# контейнер запускается непривилегированным (uid 101, пользователь nginx из образа), и все
# эти пути становятся недоступны. Здесь то же самое поведение, но с непривилегированными
# портом и каталогами — это закрывает открытый пункт «web работает от root» из
# REVIEW-12FACTORS.md.
#
# Подключение в образе (DEPLOY §5.10):
#   deploy/Dockerfile.web → COPY deploy/nginx.container.conf /etc/nginx/conf.d/default.conf
#
# Отличия от deploy/nginx.conf, кроме путей:
#   * listen 8080 и pid/temp в /tmp — требование непривилегированного режима;
#   * location /healthz — собственная проба nginx (в compose её роль играл внешний healthcheck).

# Главный конфиг nginx: pid-файл и временные каталоги обязаны быть в записываемом месте.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events {
    worker_connections 1024;
}

http {
    # Всё, что nginx пишет на диск, — только временные файлы, и только в /tmp.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;

    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Статика с хешем в имени кэшируется надолго, index.html — нет.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # healthz/readyz Api проксируем наружу — ровно как в deploy/nginx.conf: без явных
        # location они попали бы в `location /` и вернули index.html со статусом 200,
        # то есть проверка была бы всегда зелёной и одинаковой у живого и мёртвого Api.
        location = /healthz {
            proxy_pass http://api:8080/healthz;
            access_log off;
        }

        location = /readyz {
            proxy_pass http://api:8080/readyz;
            access_log off;
        }

        location /api/ {
            # Имя сервиса api совпадает с compose-именем: и там, и здесь это DNS-имя
            # в одной сети (в k8s — api.pingboard.svc.cluster.local).
            proxy_pass http://api:8080;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        location / {
            try_files $uri /index.html;
        }
    }
}
