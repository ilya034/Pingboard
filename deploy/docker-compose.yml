# deploy/docker-compose.yml — локальный стенд: postgres + api + worker + web.
# Все значения берутся из .env (фактор III/IV). Запускать из корня:
#   docker compose --env-file .env -f deploy/docker-compose.yml up -d --build
#
# ВАЖНО: `--env-file` указывает на корневой .env, потому что подстановка ${...} в самом
# compose-файле читает .env из каталога compose-файла (deploy/), а не из корня репозитория.
# Без флага POSTGRES_* в сервисе postgres остались бы умолчаниями, а строка подключения Api
# (ConnectionStrings__Default) пришла бы из .env — и Api не подключился бы к БД.
# Проверка подстановки: docker compose --env-file .env -f deploy/docker-compose.yml config
# Значения ниже — те же умолчания, что и в .env.example.
name: pingboard

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pingboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pingboard}
      POSTGRES_DB: ${POSTGRES_DB:-pingboard}
    volumes:
      # ВАЖНО: путь монтирования обязан совпадать с версией образа.
      # PostgreSQL 18+ объявляет VOLUME /var/lib/postgresql, а PGDATA у него версионный —
      # /var/lib/postgresql/18/docker. Старый путь /var/lib/postgresql/data (норма для 17
      # и ниже) в 18+ роняет entrypoint:
      #   Error: in 18+, these Docker images are configured to store database data in a format
      #   which is compatible with "pg_ctlcluster" ... there appears to be PostgreSQL data in:
      #   /var/lib/postgresql/data (unused mount/volume)
      # Контейнер выходит с кодом 1, и compose сообщает «dependency failed to start: container
      # ... is unhealthy». Проверка живёт в docker-entrypoint.sh: он ищет PG_VERSION в $PGDATA,
      # а затем отдельно проверяет, не смонтирован ли том по старому пути.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    # Порт наружу не публикуем: БД доступна только внутри сети compose.

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    env_file: ../.env
    environment:
      # Один образ, разные команды — поэтому команда задаётся здесь (фактор VIII).
      ASPNETCORE_URLS: http://+:8080
    ports:
      # На dev-стенде Api нужен с хоста (curl, smoke-скрипты), поэтому публикуем; на «проде»
      # этот же параметр задаётся как 127.0.0.1:8080 (см. .env.example) — снаружи только nginx.
      - "${API_BIND:-0.0.0.0:8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    command: ["dotnet", "worker/Pingboard.Worker.dll"]
    env_file: ../.env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # У воркера нет порта, поэтому проверяем не процесс, а пульс: цикл доиграл итерацию
      # за последние две минуты. Иначе зависший на запросе к БД воркер выглядит здоровым.
      test: ["CMD-SHELL", "test $(( $(date +%s) - $(stat -c %Y /tmp/pingboard-worker-heartbeat) )) -lt 120"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    # Воркер stateless: его можно убивать и перезапускать в любой момент (факторы VI, IX).

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    # web — отдельный профиль: `docker compose up` поднимает только postgres + api + worker
    # (быстрая проверка API и воркера), а SPA — `--profile web`, чтобы не собирать node-образ
    # на каждый прогон. Фронт (M3) уже есть: frontend/ + deploy/Dockerfile.web.
    profiles: ["web"]
    ports:
      # 8081, а не 8080: 8080 на dev-стенде занят самим Api (прямой доступ для curl).
      - "${WEB_BIND:-8081}:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata: {}
