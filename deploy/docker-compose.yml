name: pingboard

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pingboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pingboard}
      POSTGRES_DB: ${POSTGRES_DB:-pingboard}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    # Порт наружу не публикуем: БД доступна только внутри сети compose.

  api:
    image: pingboard-api:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
      args:
        APP_VERSION: ${APP_VERSION:-0.1.0}
    env_file: ../.env
    environment:
      ASPNETCORE_URLS: http://+:8080
    ports:
      # На dev-стенде Api доступен с хоста; на проде привязывается к 127.0.0.1:8080.
      #
      # Публикация фиксированного порта несовместима с запуском нескольких реплик (--scale api=2).
      # Для масштабирования используйте deploy/docker-compose.scale.yml, который снимает маппинг портов.
      - "${API_BIND:-0.0.0.0:8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 15s

  worker:
    image: pingboard-api:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
      args:
        APP_VERSION: ${APP_VERSION:-0.1.0}
    command: ["dotnet", "worker/Pingboard.Worker.dll"]
    env_file: ../.env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "dotnet", "worker/Pingboard.Worker.dll", "--self-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    # Тот же бюджет, что у Api: WorkerHost даёт hosted-сервисам 10 с на доигрывание итерации.
    stop_grace_period: 15s

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_API_DOCS_PATH: ${VITE_API_DOCS_PATH:-/scalar/v1}
    profiles: ["web"]
    ports:
      - "${WEB_BIND:-8081}:8080"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata: {}
