# deploy/nginx-host.dev.conf — ВНЕШНИЙ nginx на VPS: TLS-терминатор для dev-стенда.
#
# Это НЕ тот nginx, что внутри контейнера web (deploy/nginx.conf): здесь заканчивается TLS
# и сюда приходит трафик из интернета. Контейнер web дальше отдаёт SPA и проксирует /api.
#
# Схема:
#   интернет → nginx хоста (443, TLS) → 127.0.0.1:8081 (контейнер web) → api:8080 (внутри compose)
#
# Файл кладётся в /etc/nginx/sites-available/pingboard-dev, включается симлинком
# в sites-enabled, имя стенда подставляется вместо pingboard.example.com.
# Сертификат — Let's Encrypt через certbot (см. DEPLOY §5.9); до его получения
# работает только HTTP-блок и ACME-челлендж.

# Перенаправление всего HTTP на HTTPS, кроме ACME-челленджа (certbot использует порт 80).
server {
    listen 80;
    listen [::]:80;
    server_name pingboard.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pingboard.example.com;

    ssl_certificate     /etc/letsencrypt/live/pingboard.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pingboard.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Стенд на 1 ГБ: nginx не должен копить тело запроса в памяти целиком.
    client_max_body_size 2m;
    client_body_buffer_size 128k;

    # Заголовки прокси. X-Forwarded-For добавляется к цепочке, а не перезаписывается:
    # Api настроен на ForwardedHeaders__Enabled=true + KnownNetworks=172.16.0.0/12
    # (сеть docker), то есть доверяет заголовку только от этого прокси и берёт
    # из цепочки последний адрес. Без доверия заголовку лимит на логин считался бы
    # по адресу прокси для всех клиентов сразу.
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # Проверки вынесены отдельно, чтобы их было видно в логах доступа и легко
    # закрыть от внешнего мира (например, allow 10.0.0.0/8; deny all;).
    location = /healthz {
        proxy_pass http://127.0.0.1:8081/healthz;
        access_log off;
    }

    location = /readyz {
        proxy_pass http://127.0.0.1:8081/readyz;
        access_log off;
    }
}
