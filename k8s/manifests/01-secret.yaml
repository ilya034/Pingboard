apiVersion: v1
kind: Secret
metadata:
  name: pingboard-secrets
  namespace: pingboard
  labels:
    app.kubernetes.io/name: pingboard-secrets
    app.kubernetes.io/part-of: pingboard
type: Opaque
stringData:
  POSTGRES_PASSWORD: "pingboard_secure_pass123"
  POSTGRES_EXPORTER_DSN: "postgresql://pingboard:pingboard_secure_pass123@localhost:5432/pingboard?sslmode=disable"
  ConnectionStrings__Default: "Host=postgres;Port=5432;Database=pingboard;Username=pingboard;Password=pingboard_secure_pass123"
  JWT_SECRET: "super_secret_jwt_key_at_least_32_bytes_long_12345"
