apiVersion: apps/v1
kind: Deployment
metadata:
  name: prober
  namespace: pingboard
  labels:
    app.kubernetes.io/name: prober
    app.kubernetes.io/part-of: pingboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prober
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prober
        app.kubernetes.io/part-of: pingboard
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9101"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 15
      initContainers:
        - name: wait-for-api
          image: pingboard-api:latest
          imagePullPolicy: IfNotPresent
          command:
            - "sh"
            - "-c"
            - 'until curl -sf http://api:8080/healthz > /dev/null; do echo "Waiting for pingboard api..."; sleep 2; done'
      containers:
        - name: prober
          command: ["dotnet", "prober/Pingboard.Prober.dll"]
          image: pingboard-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9101
          envFrom:
            - configMapRef:
                name: pingboard-config
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 200m
              memory: 256Mi
