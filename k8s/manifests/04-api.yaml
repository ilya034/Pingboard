apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: pingboard
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: pingboard
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: pingboard
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: pingboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: pingboard
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: wait-for-postgres
          image: postgres:18-alpine
          imagePullPolicy: IfNotPresent
          command:
            - "sh"
            - "-c"
            - 'until pg_isready -h postgres -p 5432 -U pingboard; do echo "Waiting for postgres..."; sleep 2; done'
      containers:
        - name: api
          image: pingboard-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: pingboard-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pingboard-secrets
                  key: POSTGRES_PASSWORD
            - name: ConnectionStrings__Default
              valueFrom:
                secretKeyRef:
                  name: pingboard-secrets
                  key: ConnectionStrings__Default
            - name: Jwt__Secret
              valueFrom:
                secretKeyRef:
                  name: pingboard-secrets
                  key: JWT_SECRET
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 3"]
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 512Mi
