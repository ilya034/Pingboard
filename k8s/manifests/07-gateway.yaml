apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: pingboard-gateway
  namespace: pingboard
  labels:
    app.kubernetes.io/name: pingboard-gateway
    app.kubernetes.io/part-of: pingboard
spec:
  # - Envoy Gateway: "eg"
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pingboard-routes
  namespace: pingboard
  labels:
    app.kubernetes.io/name: pingboard-routes
    app.kubernetes.io/part-of: pingboard
spec:
  parentRefs:
    - name: pingboard-gateway
  # hostnames:
  #   - "pingboard.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: PathPrefix
            value: /ops
        - path:
            type: PathPrefix
            value: /scalar
        - path:
            type: PathPrefix
            value: /openapi
        - path:
            type: Exact
            value: /healthz
        - path:
            type: Exact
            value: /readyz
        - path:
            type: Exact
            value: /metrics
      backendRefs:
        - name: api
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: web
          port: 80
