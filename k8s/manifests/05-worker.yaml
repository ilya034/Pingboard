apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: pingboard
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: pingboard
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/part-of: pingboard
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: wait-for-postgres
          image: postgres:18-alpine
          imagePullPolicy: IfNotPresent
          command:
            - "sh"
            - "-c"
            - 'until pg_isready -h postgres -p 5432 -U pingboard; do echo "Waiting for postgres..."; sleep 2; done'
      containers:
        - name: worker
          command: ["dotnet", "worker/Pingboard.Worker.dll"]
          image: pingboard-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9100
          envFrom:
            - configMapRef:
                name: pingboard-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pingboard-secrets
                  key: POSTGRES_PASSWORD
            - name: ConnectionStrings__Default
              valueFrom:
                secretKeyRef:
                  name: pingboard-secrets
                  key: ConnectionStrings__Default
          livenessProbe:
            exec:
              command: ["dotnet", "worker/Pingboard.Worker.dll", "--self-check"]
            initialDelaySeconds: 45
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 160Mi
            limits:
              memory: 384Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
