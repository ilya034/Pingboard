# k8s/base/kustomization.yaml — базовый набор манифестов стенда.
#
# Состав намеренно неполный:
#   * Secret'а здесь нет — секреты не в git. Как его создать, описано в 80-secret.example.yaml
#     и в DEPLOY §5.10;
#   * k8s/base/60-migrate-job.yaml не в списке resources: Job одноразовый, его применяют
#     отдельной командой после того, как Postgres готов (DEPLOY §5.10).
#
# Теги образов подставляет оверлей в секции images — база ссылается на ghcr.io/OWNER/...
# как на заполнитель, чтобы «что именно закатано» было видно в одном месте.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pingboard

resources:
  - 00-namespace.yaml
  - 10-configmap.yaml
  - 20-postgres.yaml
  - 30-api.yaml
  - 40-worker.yaml
  - 50-web.yaml
  - 70-netpol.yaml
