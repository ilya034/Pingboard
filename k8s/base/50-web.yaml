# k8s/base/50-web.yaml — SPA + прокси на Api (тот же образ, что в compose).
#
# Отличие от compose-варианта только одно: контейнер запускается непривилегированным
# (uid 101, пользователь nginx), поэтому конфиг — deploy/nginx.container.conf, который
# слушает 8080 и держит pid/буферы в /tmp. runAsNonRoot: true — не украшение: он не даст
# случайно выкатить образ, который снова начнёт работать от root (в compose этот пункт
# оставался открытым — REVIEW-12FACTORS.md §4.2).
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: pingboard
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: pingboard
spec:
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: pingboard
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: pingboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: pingboard
    spec:
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/OWNER/pingboard-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Проба — собственный /healthz nginx (статика уже поднята). Проверять через /api
          # нельзя: тогда недоступный Api помечал бы SPA неготовым, хотя отдавать статику
          # он может. Готовность Api видна по своему /readyz.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          # readOnlyRootFilesystem: true требует записываемых /tmp (nginx пишет туда pid
          # и временные файлы) и /var/cache/nginx — второй закрыт volume'ом.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
---
# Единственная внешняя точка входа: ingress-контроллер кластера. Внутри контейнер web
# сам разводит статику, /api, /healthz и /readyz, поэтому Ingress ничего не маршрутизирует
# по путям — это оставлено nginx-конфигу. Так поведение в k8s совпадает с compose,
# и «два разных nginx-конфига» не расходятся по семантике (фактор X).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: pingboard
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: pingboard
spec:
  # В k3d по умолчанию стоит Traefik. В кластере с ingress-nginx значение меняется
  # на nginx (оверлей может переопределить поле).
  ingressClassName: traefik
  rules:
    - host: pingboard.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
