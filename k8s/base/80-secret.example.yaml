# k8s/base/80-secret.example.yaml — ОБРАЗЕЦ Secret'а. В git секретов нет (фактор III),
# файл нужен как документация: что именно приложение ждёт в окружении.
#
# Как создать на стенде (DEPLOY §5.10):
#
#   PGPASS="$(openssl rand -base64 24 | tr -d '/+=')"
#   kubectl -n pingboard create secret generic pingboard-secrets \
#     --from-literal=POSTGRES_PASSWORD="$PGPASS" \
#     --from-literal=ConnectionStrings__Default="Host=postgres;Port=5432;Database=pingboard;Username=pingboard;Password=$PGPASS" \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 48)"
#
# Ключи:
#   POSTGRES_PASSWORD            — пароль БД: его использует initdb контейнера postgres.
#   ConnectionStrings__Default   — строка подключения Api/Worker/Job. Лежит в Secret, а не
#                                  в ConfigMap, потому что содержит пароль: в Kubernetes
#                                  ConfigMap — это открытые данные.
#   JWT_SECRET                   — ключ подписи HS256, минимум 32 байта. Вне Development
#                                  отсутствие валидного секрета роняет старт Api (fail-fast).
#
# ВАЖНО:
#   * пароль в POSTGRES_PASSWORD и в строке подключения обязан совпадать — это две записи
#     одного значения, и расхождение выглядит как «/readyz 503, а Postgres здоров»;
#   * смена JWT_SECRET делает недействительными все выданные токены: пользователи
#     перелогинятся. Секрет сменяемый, но не «на каждый деплой»;
#   * при смене пароля БД нужно менять его и в самой БД (`ALTER USER`), иначе Postgres
#     останется со старым, а Api будет стучаться с новым.
apiVersion: v1
kind: Secret
metadata:
  name: pingboard-secrets
  namespace: pingboard
  labels:
    app.kubernetes.io/part-of: pingboard
type: Opaque
stringData:
  POSTGRES_PASSWORD: "CHANGE-ME"
  ConnectionStrings__Default: "Host=postgres;Port=5432;Database=pingboard;Username=pingboard;Password=CHANGE-ME"
  JWT_SECRET: "CHANGE-ME-минимум-32-байта"
