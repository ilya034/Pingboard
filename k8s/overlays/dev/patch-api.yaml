# k8s/overlays/dev/patch-api.yaml — dev-реплики Api: 1, ресурсы как в базе.
#
# Патч существует, чтобы было видно: масштабирование Api на dev-стенде — это правка одного
# числа, и в отличие от compose (где мешал фиксированный хост-порт, deploy/docker-compose.scale.yml)
# здесь ничего больше менять не нужно: Service сам находит эндпоинты, наружу порт не публикуется.
#
# Для запуска двух реплик под нагрузкой раскомментируйте replicas: 2 и не забудьте,
# что лимит на /api/auth/* живёт в памяти процесса: у каждой реплики он свой
# (см. REVIEW-12FACTORS.md §4.2, пункт про распределённый счётчик).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: pingboard
spec:
  replicas: 1
